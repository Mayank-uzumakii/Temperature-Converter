<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my website</title>
    <link rel="stylesheet" href="js.css">
</head>
<body>
    <form>
        <h1> Temperature Converter </h1>
        <input type="number" id="textbox" placeholder="Enter temperature" value="0"><br>
        <input type="radio" name="unit" id="fahrenheit">
        <label for="fahrenheit">Celsius to Fahrenheit</label><br>
        <input type="radio" name="unit" id="celsius">
        <label for="celsius">Fahrenheit to Celsius</label><br>
        <button type="button" onclick="convert()">Convert</button><br>
        <p id="result">select a unit and enter a temperature</p>

    </form>

    <script src="index.js"></script>
</body>
</html>
